<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر | ياسر أبو الشيخ</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="top">
  <div class="container nav">
    <a class="brand" href="/"><span class="logo">⚡</span><span>ياسر أبو الشيخ<small>للإلكترونيات</small></span></a>
    <nav class="nav-links">
      <a href="/">الرئيسية</a>
      <a href="/shop.html" class="active">المتجر</a>
      <a href="/shop.html?featured=1">العروض</a>
      <a href="/track.html">تتبع الطلب</a>
    </nav>
    <a class="cart-btn" href="/cart.html">🛒 السلة <span class="count" style="display:none">0</span></a>
  </div>
</header>

<div class="container">
  <section class="section">
    <div class="section-head"><h2>🛍️ جميع المنتجات</h2></div>
    <div class="toolbar">
      <input class="in" id="q" placeholder="🔍 ابحث عن منتج..." oninput="load()">
      <select class="in" id="cat" onchange="load()"><option value="">كل الأقسام</option></select>
      <select class="in" id="sort" onchange="load()">
        <option value="new">الأحدث</option>
        <option value="price_asc">السعر: من الأرخص</option>
        <option value="price_desc">السعر: من الأغلى</option>
        <option value="rating">الأعلى تقييماً</option>
      </select>
      <label style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem">
        <input type="checkbox" id="feat" onchange="load()"> العروض فقط
      </label>
    </div>
    <div class="grid" id="grid"><div class="empty">جاري التحميل...</div></div>
  </section>
</div>

<footer>
  <div class="container">
    <div>© 2026 متجر <b style="color:var(--gold2)">ياسر أبو الشيخ</b> للإلكترونيات</div>
    <div><a href="/track.html">تتبع الطلب</a> · <a href="/admin.html">دخول الإدارة</a></div>
  </div>
</footer>

<script src="/js/app.js"></script>
<script>
const qs = new URLSearchParams(location.search);
let _t;
async function init() {
  const cats = await loadCats();
  const sel = document.getElementById("cat");
  cats.forEach(c => {
    const o = document.createElement("option");
    o.value = c.slug; o.textContent = `${c.icon} ${c.name}`;
    sel.appendChild(o);
  });
  if (qs.get("category")) sel.value = qs.get("category");
  if (qs.get("featured")) document.getElementById("feat").checked = true;
  if (qs.get("q")) document.getElementById("q").value = qs.get("q");
  load();
}
async function load() {
  clearTimeout(_t);
  _t = setTimeout(async () => {
    const p = new URLSearchParams({
      search: document.getElementById("q").value.trim(),
      category: document.getElementById("cat").value,
      sort: document.getElementById("sort").value,
      featured: document.getElementById("feat").checked ? "1" : "0",
    });
    const list = await api("/api/products?" + p);
    document.getElementById("grid").innerHTML =
      list.map(productCard).join("") || `<div class="empty"><div class="big">🔍</div>لا توجد نتائج مطابقة</div>`;
  }, 250);
}
init();
</script>
</body>
</html>
