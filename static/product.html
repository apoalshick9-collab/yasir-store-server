<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج | ياسر أبو الشيخ</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="top">
  <div class="container nav">
    <a class="brand" href="/"><span class="logo">⚡</span><span>ياسر أبو الشيخ<small>للإلكترونيات</small></span></a>
    <nav class="nav-links">
      <a href="/">الرئيسية</a>
      <a href="/shop.html" class="active">المتجر</a>
      <a href="/track.html">تتبع الطلب</a>
    </nav>
    <a class="cart-btn" href="/cart.html">🛒 السلة <span class="count" style="display:none">0</span></a>
  </div>
</header>

<div class="container" id="wrap"><div class="empty">جاري التحميل...</div></div>

<footer>
  <div class="container">
    <div>© 2026 متجر <b style="color:var(--gold2)">ياسر أبو الشيخ</b> للإلكترونيات</div>
    <div><a href="/track.html">تتبع الطلب</a> · <a href="/admin.html">دخول الإدارة</a></div>
  </div>
</footer>

<script src="/js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
let P = null;

function stockLine(s) {
  if (s <= 0) return `<span class="stock-out">❌ نفد المخزون</span>`;
  if (s < 5) return `<span class="stock-low">⚠️ بقي ${s} قطع فقط!</span>`;
  return `<span class="stock-ok">✅ متوفر بالمخزون</span>`;
}

async function init() {
  if (!id) { document.getElementById("wrap").innerHTML = `<div class="empty">منتج غير موجود</div>`; return; }
  await loadCats();
  try { P = await api("/api/products/" + id); }
  catch { document.getElementById("wrap").innerHTML = `<div class="empty"><div class="big">😕</div>المنتج غير موجود</div>`; return; }
  document.title = P.name + " | ياسر أبو الشيخ";
  const imgs = (P.images && P.images.length ? P.images : ["/img/placeholder.webp"]);
  const specs = Object.entries(P.specs || {}).map(([k, v]) => `<div class="sp"><b>${k}</b><span>${v}</span></div>`).join("");
  const reviews = await api(`/api/products/${id}/reviews`);
  document.getElementById("wrap").innerHTML = `
    <div class="pd">
      <div class="gallery">
        <img class="main" id="mainImg" src="${imgs[0]}" alt="${P.name}">
        ${imgs.length > 1 ? `<div style="display:flex;gap:8px;margin-top:8px">` +
          imgs.map((s, i) => `<img src="${s}" onclick="document.getElementById('mainImg').src='${s}'"
            style="width:70px;height:70px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--border)">`).join("") + `</div>` : ""}
      </div>
      <div>
        <div class="cat" style="color:var(--gold2);font-weight:700">${catName(P.category)}</div>
        <h1>${P.name}</h1>
        <div class="rating">${stars(P.rating)} <span style="color:var(--muted)">(${P.reviews_count} تقييم)</span></div>
        <div class="price-row" style="margin:12px 0">
          <span class="price" style="font-size:1.6rem">${fmt(P.price)}</span>
          ${P.old_price ? `<span class="old-price" style="font-size:1.1rem">${fmt(P.old_price)}</span>` : ""}
        </div>
        <div style="margin-bottom:12px">${stockLine(P.stock)}</div>
        <p class="desc">${P.description}</p>
        <div style="display:flex;gap:10px;margin:16px 0">
          <button class="btn" onclick="Cart.add(${P.id})" ${P.stock <= 0 ? "disabled" : ""}>🛒 أضف إلى السلة</button>
          <a class="btn ghost" href="/cart.html">إتمام الطلب ←</a>
        </div>
        <h3 style="margin:18px 0 8px">📋 المواصفات</h3>
        <div class="specs">${specs || "<div class='sp'><span>—</span></div>"}</div>
      </div>
    </div>
    <section class="section">
      <div class="section-head"><h2>💬 آراء العملاء</h2></div>
      <div id="revs">${reviews.map(r => `
        <div class="review"><div class="rn">${r.name} <span class="rating">${stars(r.rating)}</span></div>
        <div style="color:var(--muted);font-size:.92rem">${r.comment}</div></div>`).join("")
        || `<div class="empty">لا توجد تقييمات بعد — كن أول من يقيّم!</div>`}</div>
      <div class="form-card" style="margin:20px 0;max-width:100%">
        <h3>✍️ أضف تقييمك</h3>
        <div class="row2">
          <div><label class="lbl">الاسم</label><input class="in" id="rvName" placeholder="اسمك"></div>
          <div><label class="lbl">التقييم</label>
            <select class="in" id="rvStars"><option value="5">★★★★★ ممتاز</option><option value="4">★★★★ جيد جداً</option>
            <option value="3">★★★ جيد</option><option value="2">★★ مقبول</option><option value="1">★ سيئ</option></select></div>
        </div>
        <label class="lbl">تعليقك</label><textarea class="in" id="rvText" placeholder="شاركنا رأيك بالمنتج..."></textarea>
        <button class="btn" style="margin-top:14px" onclick="sendReview()">نشر التقييم</button>
      </div>
    </section>`;
}

async function sendReview() {
  const name = document.getElementById("rvName").value;
  const rating = document.getElementById("rvStars").value;
  const comment = document.getElementById("rvText").value.trim();
  if (!comment) return toast("⚠️ اكتب تعليقك أولاً");
  try {
    await api(`/api/products/${id}/reviews`, { method: "POST", body: JSON.stringify({ name, rating, comment }) });
    toast("✅ شكراً! تم نشر تقييمك");
    init();
  } catch (e) { toast("⚠️ " + e.message); }
}
init();
</script>
</body>
</html>
