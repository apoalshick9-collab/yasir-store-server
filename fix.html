(async()=>{
 try{
  log("1) signup temp admin");
  const em="tmpfix"+Date.now()+"@yasir-store.tmp", pw="TmpFix#"+Date.now();
  let [st,d]=await req(AUTH+":signUp?key="+API_KEY,"POST",{email:em,password:pw,returnSecureToken:true});
  if(st!==200) throw "signup failed "+st+" "+JSON.stringify(d).slice(0,150);
  const idToken=d.idToken, uid=d.localId; log("uid="+uid);
  const AH={Authorization:"Bearer "+idToken};
  log("2) create config/admin");
  [st,d]=await req(BASE+"/config?documentId=admin&key="+API_KEY,"POST",{fields:{uid:S(uid),created_at:N(Date.now())}},AH);
  if(st!==200) throw "config/admin failed "+st+" "+JSON.stringify(d).slice(0,150);
  log("3) delete "+OLD_IDS.length+" old docs (fire-and-forget)");
  for(const id of OLD_IDS){ fire(BASE+"/products/"+id+"?key="+API_KEY,"DELETE",null,AH); await sleep(700); }
  log("4) create 12 products (fire-and-forget)");
  for(const p of PRODUCTS){
    const body={fields:{
      name:S(p.name),category:S(p.category),price:N(p.price),old_price:NL(p.old_price),
      stock:N(p.stock),description:S(p.description),specs:MAP(p.specs||{}),
      images:ARR(["data:image/webp;base64,"+IMGS[p.imgk]]),
      featured:B(p.featured),active:B(true),rating:{doubleValue:5.0},reviews_count:N(0),created_at:N(Date.now())
    }};
    fire(BASE+"/products?key="+API_KEY,"POST",body,AH);
    log("  fired "+p.name); await sleep(2500);
  }
  log("5) waiting 20s for writes to land...");
  await sleep(20000);
  log("6) delete config/admin (fire-and-forget)");
  fire(BASE+"/config/admin?key="+API_KEY,"DELETE",null,AH);
  await sleep(3000);
  log("FIX DONE — verify externally");
 }catch(e){ log("FAILED: "+e); }
})();
